[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urent-test-bot"
version = "0.1.0"
description = "Private Telegram test client for the Urent Toolkit SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "python-telegram-bot>=21,<23",
    "urent-toolkit",
]

[project.scripts]
urent-test-bot = "urent_test_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
urent-toolkit = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
